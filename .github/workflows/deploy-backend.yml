name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            cd ~/workout-log

            git fetch origin main
            git reset --hard origin/main

            docker build -t workout-log-backend ./backend

            docker rm -f workout-log-backend || true

            docker run -d \
              --name workout-log-backend \
              --restart unless-stopped \
              --env-file .env.ec2 \
              -p 8080:8080 \
              workout-log-backend

            sleep 5

            docker ps --filter "name=workout-log-backend"
          EOF
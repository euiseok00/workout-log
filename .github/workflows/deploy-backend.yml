name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        run: |
          set -e

          cd ~/workout-log

          git fetch origin main
          git reset --hard origin/main

          docker build -t workout-log-backend ./backend

          docker rm -f workout-log-backend || true

          docker run -d \
            --name workout-log-backend \
            --restart unless-stopped \
            --env-file .env.ec2 \
            -p 8080:8080 \
            workout-log-backend

          sleep 5

          docker ps --filter "name=workout-log-backend"
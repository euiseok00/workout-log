spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/workout_log
spring.datasource.username=workout_app
spring.datasource.password=${WORKOUT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${WORKOUT_JWT_SECRET}
app.jwt.issuer=workout-log
app.jwt.access-token-ttl=PT1H
app.cors.allowed-origin=${WORKOUT_FRONTEND_ORIGIN:http://localhost:5173}

services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: workout_log
      POSTGRES_USER: workout_app
      POSTGRES_PASSWORD: "${WORKOUT_DB_PASSWORD:?Set WORKOUT_DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_app -d workout_log"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workout_log
      SPRING_DATASOURCE_USERNAME: workout_app
      SPRING_DATASOURCE_PASSWORD: "${WORKOUT_DB_PASSWORD:?Set WORKOUT_DB_PASSWORD in .env}"
      WORKOUT_JWT_SECRET: "${WORKOUT_JWT_SECRET:?Set WORKOUT_JWT_SECRET in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
